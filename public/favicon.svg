<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="pGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0071E3" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0071E3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS Squircle Base (Clean Light) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradLight)" stroke="#E2E8F0" stroke-width="4" />

  <!-- Concentric Proximity Radar Rings (Luminous Sky Blue) -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#0071E3" stroke-width="3" opacity="0.2" />
  <circle cx="256" cy="240" r="120" fill="none" stroke="#0071E3" stroke-width="4" opacity="0.35" />
  <circle cx="256" cy="240" r="80" fill="none" stroke="#0284C7" stroke-width="6" opacity="0.55" />
  <circle cx="256" cy="240" r="45" fill="none" stroke="#06B6D4" stroke-width="5" opacity="0.75" />

  <!-- Geometric Monogram P in Apple Electric Blue -->
  <path d="M 210 160 L 290 160 C 330 160 350 185 350 220 C 350 255 330 280 290 280 L 250 280 L 250 360 L 210 360 Z M 250 200 L 250 240 L 285 240 C 300 240 310 232 310 220 C 310 208 300 200 285 200 Z" 
        fill="url(#pGradBlue)" 
        filter="url(#softShadow)" />

  <!-- Core Beacon Node -->
  <circle cx="256" cy="240" r="14" fill="#06B6D4" stroke="#FFFFFF" stroke-width="4" />
</svg>