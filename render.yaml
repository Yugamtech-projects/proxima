services:
  - type: web
    name: proxima-backend
    env: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install poetry && poetry install --no-root
    startCommand: poetry run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_SCHEMA
        value: Proxima
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_ProximaDemo2026
      - key: RAZORPAY_KEY_SECRET
        value: ProximaSecretDevKey2026
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ProximaWebhookSecret2026
      - key: CORS_ORIGINS
        value: "https://proxima.network,https://proxima.netlify.app"
