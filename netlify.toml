[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api calls directly to Render backend (eliminates CORS in production)
[[redirects]]
  from = "/api/*"
  to = "https://proxima-backend-vd5h.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
